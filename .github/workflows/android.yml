name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "رابط الموقع الذي يفتحه التطبيق"
        required: false
        default: "https://wep-sender-wahsap-evz6.onrender.com/"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          export SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon -PAPP_URL="${{ github.event.inputs.app_url || 'https://wep-sender-wahsap-evz6.onrender.com/' }}"
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WP-Sender.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WP-Sender-apk
          path: WP-Sender.apk
      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: WP Sender APK (latest)
          body: "حمّل WP-Sender.apk وثبّته على أندرويد."
          files: WP-Sender.apk
